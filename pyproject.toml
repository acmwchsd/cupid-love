[project]
name = "cupid-love"
version = "0.1.0"
description = "A small matchmaking MCP server built with FastMCP"
readme = "README.md"
authors = [
    { name = "Visal Som", email = "visalsom.app@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.8",
]

[project.scripts]
cupid-love = "cupid_love:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
